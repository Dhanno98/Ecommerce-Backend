spring.application.name=sb-ecom

# PostgreSQL
spring.datasource.url=${DB_POSTGRES_URL}
spring.datasource.username=${DB_POSTGRES_USERNAME}
spring.datasource.password=${DB_POSTGRES_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Jwt
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=900000
spring.app.refreshTokenExpirationMs=3600000
spring.app.jwtCookieName=springBootEcom

# Stripe Key
stripe.secret.key=${STRIPE_SECRET_KEY}

# Redis
spring.data.redis.url=${REDIS_URL}
cache.duration.minutes=10

# Frontend
frontend.url=${FRONTEND_URL}

# Images
image.base.url=${IMAGE_BASE_URL}
project.image=images/

spring.profiles.default=dev

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB